 -webkit-mask-image:linear-gradient(to bottom,transparent 0px,transparent 110px,rgba(0,0,0,.35) 250px,rgba(0,0,0,.85) 340px,#000 400px);mask-image:linear-gradient(to bottom,transparent 0px,transparent 110px,rgba(0,0,0,.35) 250px,rgba(0,0,0,.85) 340px,#000 400px)}

 background:repeating-conic-gradient(from 0deg,rgba(255,210,120,.20) 0deg 4deg,transparent 4deg 15deg);

 background:radial-gradient(ellipse at 50% 30%,rgba(120,14,6,.92),rgba(50,0,0,.92));border:3px solid #f0c050;box-shadow:0 0 60px rgba(255,170,40,.65)}

 <div class="shot" id="sa"><img id="ia"/></div>

 <div id="cntbox"><canvas id="ring" width="250" height="250"></canvas><div id="cnt">१</div><div id="cntsub">जाप / १०८</div></div>
 <div id="cta"></div>

 <div id="teaser"><span id="ttxt"></span><div class="shine" id="tsh"></div></div>
 <div id="hook"><div class="h1">रुका हुआ काम?</div><div class="h2">१०८ बार सुनिए 🙏</div></div>
 <div id="slot"><div id="bname"><div class="t1">All about बाप्पा</div><div class="t2">GANESH JI</div><div class="shine" id="bsh"></div></div>
  <div id="blogo"><img src="assets/logo.png"/><div class="shine" id="lsh"></div></div></div>
 <div id="flash"></div>
 <div id="black" style="position:absolute;inset:0;background:#000;opacity:0;pointer-events:none"></div>
</div>
<script>
const D=window.DATA, W=1920, H=1080, FPSV=24;
const $=id=>document.getElementById(id);
const dev=n=>String(n).replace(/[0-9]/g,d=>'०१२३४५६७८९'[d]);
const clamp=(x,a,b)=>Math.max(a,Math.min(b,x));
const ease=x=>x<.5?2*x*x:1-Math.pow(-2*x+2,2)/2;
const easeOut=x=>1-Math.pow(1-x,3);
const lerp=(a,b,p)=>a+(b-a)*p;
// ---------- seeded random ----------
function rnd(i){let x=Math.sin(i*127.1+311.7)*43758.5453;return x-Math.floor(x);}
// ---------- shot geometry ----------
function shotGeom(sh,t){
  const p=clamp((t-sh.t0)/Math.max(.001,sh.t1-sh.t0),0,1), e=ease(p);
  const z=lerp(sh.z0,sh.z1,e);
  const im=D.IM[sh.img];
  let f=sh.focus==='face'?im.face:sh.focus==='mala'?im.mala:(sh.det||im.face);
  const ax=sh.anchor[0]*W+(sh.pan?sh.pan*(e-.5):0), ay=sh.anchor[1]*H;
  let left=ax-f[0]*W*z, top=ay-f[1]*H*z;
  left=clamp(left,W-W*z,0); top=clamp(top,H-H*z,0);
  return {z,left,top,mala:[left+im.mala[0]*W*z, top+im.mala[1]*H*z]};
}
function shotAt(t){let i=0;for(let k=0;k<D.shots.length;k++){if(t>=D.shots[k].t0)i=k;}return i;}
const TR=1.4;
async function setImg(el,src){ if(el.dataset.src!==src){el.dataset.src=src; el.src=src; try{await el.decode();}catch(e){}} }
const CLIPN={pa1:158,eyes:158,aarti:158}; function clipSrc(sh,t){const n=CLIPN[sh.clip]||158; const rate=sh.rate||((sh.clip==='hook_s02')?0.9:1.0);
  const f=clamp(Math.floor((t-sh.t0)*FPSV*rate),0,n-1)+1; return `assets/fr/${sh.clip}/${String(f).padStart(4,'0')}.jpg`;}
async function drawShot(slot,img,sh,t,op,ext,blur,bump){
  const g=shotGeom(sh,t);
  await setImg(img, sh.clip?clipSrc(sh,t):D.IM[sh.img].src);
  img.style.transform=`translate(${g.left}px,${g.top}px) scale(${g.z})`;
  const sc=ext*bump;
  slot.style.transform=`scale(${sc})`; slot.style.opacity=op; slot.style.filter=blur>0.2?`blur(${blur.toFixed(1)}px)`:'none';
  // mala point after the slot scale (origin 50% 45%)
  const ox=W*0.5, oy=H*0.45; g.mala=[ox+(g.mala[0]-ox)*sc, oy+(g.mala[1]-oy)*sc];
  return g;
}
// ---------- havan ----------
const AH=[0].concat(D.S.map(s=>s-3.45)); // ahuti clip start times
function ahutiAt(t){for(const a of AH){if(t>=a&&t<a+6.58)return a;}return null;}
async function drawHavan(t,hidden){
  const hv=$('havan'); hv.style.opacity=hidden;
  const fi=Math.floor(t*FPSV)%243+1;
  await setImg($('hidle'),`assets/fr/idle/${String(fi).padStart(4,'0')}.jpg`);
  const a=ahutiAt(t); const ha=$('hahuti');
  if(a!==null){const f=clamp(Math.floor((t-a)*FPSV),0,157)+1; await setImg(ha,`assets/fr/ahuti/${String(f).padStart(4,'0')}.jpg`);
    const d=t-a; ha.style.opacity=clamp(Math.min(d/0.25,(6.58-d)/0.25),0,1);} else ha.style.opacity=0;
}
// ---------- fx canvas ----------
const cx=$('fx').getContext('2d');
const FIRE=[960,700];
function drawFx(t,malaPt,havanVis){
  cx.clearRect(0,0,W,H); cx.globalCompositeOperation='lighter';
  // fire sparks
  if(havanVis>0.05){for(let i=0;i<70;i++){const life=2.2+rnd(i)*1.8, ph=rnd(i+99)*life; const a=((t+ph)%life)/life;
    const x=FIRE[0]+(rnd(i+7)-.5)*300+Math.sin(t*2+i)*18*a, y=FIRE[1]+90-a*(330+rnd(i+3)*200);
    const r=1.5+rnd(i+5)*2.5; const al=(1-a)*havanVis*.9; spark(x,y,r*3,`rgba(255,${150+Math.floor(rnd(i)*80)},60,${al})`);}}
  // floating dust over the whole frame
  for(let i=0;i<45;i++){const x=(rnd(i+500)*W+t*(8+rnd(i+600)*14))%W, y=(rnd(i+700)*H - t*(5+rnd(i)*8)+H*5)%H;
    const tw=.25+.25*Math.sin(t*1.3+i); spark(x,y,4+rnd(i+800)*5,`rgba(255,225,160,${tw*.5})`);}
  // orb flights
  for(let n=0;n<D.S.length;n++){const s=D.S[n], d=t-s; if(d<-0.1||d>2.3)continue;
    const tx=malaPt[0], ty=malaPt[1];
    const c1=[FIRE[0]-60,FIRE[1]-360], st=[FIRE[0],FIRE[1]-30];
    if(d>=0&&d<=1.25){const p=easeOut(d/1.25);
      for(let k=0;k<14;k++){const q=Math.max(0,p-k*0.025); const x=(1-q)*(1-q)*st[0]+2*(1-q)*q*c1[0]+q*q*tx, y=(1-q)*(1-q)*st[1]+2*(1-q)*q*c1[1]+q*q*ty;
        spark(x,y,(26-k*1.5),`rgba(255,${200-k*6},${90-k*4},${(1-k/14)*.9})`);}}
    if(d>1.1){const b=(d-1.1)/1.2; if(b<=1){ // burst at the mala
      spark(tx,ty,60+b*40,`rgba(255,230,140,${(1-b)*.95})`);
      cx.lineWidth=4*(1-b); cx.strokeStyle=`rgba(255,215,110,${1-b})`; cx.beginPath(); cx.arc(tx,ty,20+b*150,0,6.283); cx.stroke();
      cx.lineWidth=2*(1-b); cx.beginPath(); cx.arc(tx,ty,10+b*90,0,6.283); cx.stroke();
      for(let k=0;k<16;k++){const ang=k/16*6.283+n; const r=20+b*170; spark(tx+Math.cos(ang)*r,ty+Math.sin(ang)*r,6*(1-b)+2,`rgba(255,220,130,${1-b})`);}}}
  }
  // milestone petals
  for(const m of D.milestones){const d=t-m.t; if(m.quiet||d<0||d>4.2)continue;
    for(let i=0;i<90;i++){const st=rnd(i+m.n)*1.2; if(d<st)continue; const a=(d-st);
      const x=rnd(i*3+m.n)*W+Math.sin(a*2+i)*40, y=-40+a*(260+rnd(i+11)*200); const al=clamp(1-(d-3.2),0,1);
      cx.globalCompositeOperation='source-over'; cx.save(); cx.translate(x,y); cx.rotate(a*2+i); cx.fillStyle=i%3?`rgba(255,${120+Math.floor(rnd(i)*60)},20,${al})`:`rgba(230,30,40,${al})`;
      cx.beginPath(); cx.ellipse(0,0,13,7,0,0,6.283); cx.fill(); cx.restore(); cx.globalCompositeOperation='lighter';}}
  cx.globalCompositeOperation='source-over';
}
function spark(x,y,r,col){const g=cx.createRadialGradient(x,y,0,x,y,r);g.addColorStop(0,col);g.addColorStop(1,'rgba(0,0,0,0)');cx.fillStyle=g;cx.beginPath();cx.arc(x,y,r,0,6.283);cx.fill();}
// ---------- ring ----------
const rc=$('ring').getContext('2d');
function drawRing(done,t){rc.clearRect(0,0,250,250);
  rc.beginPath();rc.arc(125,125,112,0,6.283);rc.fillStyle='rgba(50,2,0,.62)';rc.fill();rc.lineWidth=3;rc.strokeStyle='#e2b13c';rc.stroke();
  for(let i=0;i<108;i++){const a=-Math.PI/2+i/108*6.283, x=125+Math.cos(a)*100, y=125+Math.sin(a)*100;
    const on=i<done; rc.beginPath(); rc.arc(x,y,on?4.2:3.2,0,6.283);
    rc.fillStyle=on?'#ffd45e':'rgba(150,90,60,.65)'; if(on){rc.shadowColor='rgba(255,180,40,.9)';rc.shadowBlur=8;} rc.fill(); rc.shadowBlur=0;}
  // sumeru bead at top
  rc.beginPath();rc.arc(125,25-6,7,0,6.283);rc.fillStyle='#c0392b';rc.fill();
}
// ---------- main ----------
window.__timelines={main:{seek(){}}};
window.__onSeek=async function(t){
  const i=shotAt(t), sh=D.shots[i], nx=D.shots[i+1], pv=D.shots[i-1];
  // slow zoom-dissolve between shots (no sliding)
  let bump=1; for(const sv of D.S){const d=t-(sv+1.25); if(d>=0&&d<0.9) bump=Math.max(bump,1+0.03*Math.sin(Math.PI*Math.min(1,d/0.9)));}
  for(const m of D.milestones){const d=t-m.t; if(!m.quiet&&d>=0&&d<3.0) bump=Math.max(bump,1+0.06*Math.sin(Math.PI*d/3.0));}
  for(const q of (D.teasers||[])){const d=t-q.t; if(d>=0&&d<2.2) bump=Math.max(bump,1+0.07*Math.sin(Math.PI*d/2.2));}
  let A={sh,op:1,ext:1,blur:0}, B=null, mix=0;
  if(nx && !nx.cont && t>nx.t0-TR/2){ const p=ease(clamp((t-(nx.t0-TR/2))/TR,0,1)); mix=p;
    A={sh,op:1,ext:1+0.05*p,blur:0}; B={sh:nx,op:p,ext:1.10-0.10*easeOut(p),blur:4*(1-p)}; }
  else if(pv && !sh.cont && t<sh.t0+TR/2){ const p=ease(clamp((t-(sh.t0-TR/2))/TR,0,1)); mix=p;
    B={sh,op:p,ext:1.10-0.10*easeOut(p),blur:4*(1-p)}; A={sh:pv,op:1,ext:1+0.05*p,blur:0}; }
  const gA=await drawShot($('sa'),$('ia'),A.sh,t,A.op,A.ext,A.blur,bump);
  let gB=null;
  if(B){$('sb').style.display='block'; gB=await drawShot($('sb'),$('ib'),B.sh,t,B.op,B.ext,B.blur,bump);} else $('sb').style.display='none';
  $('leak').style.opacity=B?0.55*Math.sin(Math.PI*mix):0;
  // havan hidden on s07 shots (it has its own fire)
  let hv=1; const s7=(s)=>(D.noHavan||[]).includes(s.img);
  if(!B){ if(s7(A.sh)) hv=0; } else { const a7=s7(A.sh)?0:1, b7=s7(B.sh)?0:1; hv=a7*(1-B.op)+b7*B.op; }
  await drawHavan(t,hv);
  const malaPt=(gB&&B.op>0.5)?gB.mala:gA.mala;
  drawFx(t,malaPt,hv);
  // flash: hook flare + milestones
  let fl=0; const hk=t-2.9; if(hk>=0&&hk<.5) fl=Math.max(fl,.8*(1-hk/.5));
  for(const m of D.milestones){const d=t-m.t; if(!m.quiet&&d>=0&&d<.45) fl=Math.max(fl,.85*(1-d/.45));}
  $('flash').style.opacity=fl;
  // counter
  let cur=1; for(let n=0;n<D.OM.length;n++) if(t>=D.OM[n]) cur=n+1;
  let done=0; for(const s of D.S) if(t>=s+1.25) done++;
  $('cnt').textContent=dev(Math.min(cur,108)); drawRing(done,t);
  const pulse=D.S.some(s=>t>=s+1.25&&t<s+1.6); $('cnt').style.transform=`scale(${pulse?1.12:1})`;
  // karaoke phrases
  let ph=0; for(let n=0;n<D.OM.length;n++){const om=D.OM[n], c=D.C[n+1], s=D.S[n];
    if(t>=om&&t<om+2.3) ph=1; else if(t>=om+2.3&&t<om+6.5) ph=2; else if(c&&t>=c-0.05&&t<s+0.3) ph=3;}
  ['p1','p2','p3'].forEach((id,k)=>$(id).className=(ph===k+1)?'on':'');
  // hook
  const hk2=clamp((t-4.0)/0.8,0,1); $('hook').style.opacity=1-hk2; $('hook').style.transform=`scale(${(t<0.6?1.18-0.18*easeOut(t/0.6):1)-0.25*hk2}) translateY(${-60*hk2}px)`;
  // milestone card
  let mo=0, mt=null; for(const m of D.milestones){const T0=m.cardT||m.t, DU=m.dur||(m.cardT?4.5:4.0); const d=t-T0; if(d>=0&&d<DU){mt=m; mo=Math.min(clamp(d/0.4,0,1),clamp((DU-d)/0.5,0,1));}}
  $('mile').style.top=((mt&&mt.top)||330)+'px';
  if(mt){$('m1').textContent=mt.m1||`${dev(mt.n)} जाप पूर्ण ✨`; $('m2').textContent=mt.m2||'';}
  $('mile').style.opacity=mo; $('mile').style.transform=`translateX(-50%) scale(${0.85+0.15*easeOut(mo)})`;
  // CTA
  let co=0; for(const c of D.cta){const d=t-c.t; if(d>=0&&d<5.5){co=Math.min(clamp(d/0.4,0,1),clamp((5.5-d)/0.4,0,1));
    $('cta').innerHTML=c.kind==='like'?'👍 <b>Like</b> करें · बाप्पा का आशीर्वाद सबको':c.kind==='comment'?'💬 कमेंट में लिखें: <b>ॐ गं गणपतये नमः</b>':'🔔 <b>Subscribe</b> करें · All about बाप्पा';}}
  $('cta').style.opacity=co; $('cta').style.transform=`translateX(${-40*(1-co)}px)`;
  // teaser card + light sweep
  let to=0, tq=null; for(const q of (D.teasers||[])){const d=t-q.t; if(d>=0&&d<5.2){tq=q; to=Math.min(clamp(d/0.5,0,1),clamp((5.2-d)/0.6,0,1));
    $('ttxt').textContent=q.txt; $('tsh').style.transform=`translateX(${d>0.6&&d<1.8?1500*ease((d-.6)/1.2):(d>=1.8?1500:0)}px) skewX(-20deg)`;}}
  $('teaser').style.opacity=to; $('teaser').style.transform=`translateX(-50%) translateY(${-30*(1-easeOut(to))}px) scale(${0.9+0.1*easeOut(to)})`;
  let so=0, sp=0; for(const w of (D.sweeps||[])){const d=t-w.t0; if(d>=0&&d<1.8){sp=d/1.8; so=Math.sin(Math.PI*sp);}}
  $('sweep').style.opacity=so*0.9; $('sweep').style.backgroundPosition=`${100-100*sp}% 0`;
  // god rays behind Bappa at milestones
  let ro=0; for(const m of D.milestones){const d=t-m.t; if(!m.quiet&&d>=0&&d<5.0) ro=Math.max(ro,Math.min(clamp(d/0.6,0,1),clamp((5.0-d)/1.2,0,1)));}
  $('rays').style.opacity=ro*0.85; $('rays').style.transform=`rotate(${t*6}deg)`;
  // after the chant: fade karaoke, counter; final fade to black
  if(D.CHANT_END){const kf=1-clamp((t-(D.CHANT_END-1.4))/1.0,0,1); $('mantra').style.opacity=kf; $('mband').style.opacity=kf;
    $('cntbox').style.opacity=1-clamp((t-1097.0)/1.0,0,1); $('black').style.opacity=clamp((t-(D.END-1.3))/1.2,0,1);}
  // brand badge: 10 s cycle starting at 8 s, name 0-4.85, logo 5.0-9.85
  const bt=t-8; const bn=$('bname'), bl=$('blogo');
  if(bt<0){bn.style.opacity=0; bl.style.opacity=0;} else { const c=bt%10;
    if(c<5){const pin=easeOut(clamp(c/0.7,0,1)), pout=clamp((c-4.4)/0.45,0,1); const o=pin*(1-pout);
      bn.style.opacity=o; bn.style.transform=`translateX(${60*(1-pin)+40*pout}px) scaleX(${0.2+0.8*pin-0.8*pout})`;
      $('bsh').style.transform=`translateX(${c>0.9&&c<1.9?580*ease((c-.9)/1):(c>3&&c<4?580*ease(c-3):0)}px) skewX(-20deg)`; bl.style.opacity=0;}
    else {const d=c-5; const pin=clamp(d/0.9,0,1); const bo=pin<1?1+2.6*Math.pow(pin-1,3)+1.6*Math.pow(pin-1,2):1; // back.out
      const pout=clamp((d-4.4)/0.45,0,1); const spin=d>2.6&&d<3.8?360*ease((d-2.6)/1.2):(d>=3.8?360:0);
      bl.style.opacity=clamp(pin*2,0,1)*(1-pout); bl.style.transform=`scale(${(0.4+0.6*bo)*(1-0.6*pout)}) rotate(${-120*(1-pin)+spin+120*pout}deg)`;
      $('lsh').style.transform=`translateX(${d>1.1&&d<2.0?380*ease((d-1.1)/.9):0}px) skewX(-20deg)`; bn.style.opacity=0;}}
};
