<!doctype html><html><head><meta charset="UTF-8"/><meta name="viewport" content="width=1920, height=1080"/>
<script src="assets/gsap.min.js"></script>
<style>
@font-face{font-family:Brand;src:url(assets/yatra-dev.woff2) format('woff2');unicode-range:U+0900-097F,U+1CD0-1CF9,U+200C-200D,U+20A8,U+20B9,U+25CC,U+A830-A839,U+A8E0-A8FF}
@font-face{font-family:Brand;src:url(assets/yatra-lat.woff2) format('woff2');unicode-range:U+0000-00FF}
@font-face{font-family:BrandSub;src:url(assets/nsd-lat.woff2) format('woff2');font-weight:700}
html,body{margin:0;width:1920px;height:1080px;overflow:hidden;background:#000}
#root{position:relative;width:1920px;height:1080px;overflow:hidden}
.bg{position:absolute;inset:0;background:url(assets/bg.jpg) center/cover}
/* badge slot bottom-right; name and logo share the slot, never visible together */
#slot{position:absolute;right:44px;bottom:40px;width:420px;height:150px}
#name{transform-origin:100% 50%;position:absolute;right:0;bottom:18px;padding:14px 30px 16px 26px;border-radius:60px;
 background:linear-gradient(135deg,rgba(110,8,8,.82),rgba(55,0,0,.82));border:2px solid #e2b13c;
 box-shadow:0 0 0 1px rgba(0,0,0,.4),0 8px 30px rgba(0,0,0,.45),inset 0 0 18px rgba(255,190,80,.25);overflow:hidden;white-space:nowrap}
#name .t1{font:400 46px/1 Brand;background:linear-gradient(180deg,#fff3c4 0%,#f5c84c 45%,#c98a12 100%);-webkit-background-clip:text;color:transparent;}
#name .t2{font:700 20px/1 BrandSub;color:#ffe7a8;letter-spacing:4px;text-transform:uppercase;margin-top:6px;opacity:.9;text-align:right}
#name .shine,#logo .shine{position:absolute;top:-20%;bottom:-20%;width:60px;left:-120px;transform:skewX(-20deg);
 background:linear-gradient(90deg,transparent,rgba(255,255,255,.75),transparent);mix-blend-mode:screen}
#logo{position:absolute;right:10px;bottom:0;width:150px;height:150px;border-radius:50%;
 box-shadow:0 0 30px rgba(255,190,60,.55),0 8px 24px rgba(0,0,0,.5);overflow:hidden}
#logo img{width:100%;height:100%;display:block}
</style></head><body>
<div id="root" data-composition-id="main" data-start="0" data-duration="20" data-width="1920" data-height="1080">
 <div id="bg" class="bg clip" data-start="0" data-duration="20" data-track-index="0"></div>
 <div id="slot" class="clip" data-start="0" data-duration="20" data-track-index="1">
  <div id="name"><div class="t1">All about बाप्पा</div><div class="t2">Ganesh ji</div><div class="shine"></div></div>
  <div id="logo"><img src="assets/logo.png"/><div class="shine"></div></div>
 </div>
</div>
<script>
const tl=gsap.timeline({paused:true});
const CYCLE=10, DUR=20; let first=true;
const IR=()=>{const v=first?{}:{immediateRender:false};return v;};
for(let t=0;t<DUR;t+=CYCLE){
  const ir=first?{}:{immediateRender:false};
  // NAME: in 0.05-0.75, two shines, out 4.4-4.85
  tl.fromTo("#name",{opacity:0,x:60,scaleX:.2},{opacity:1,x:0,scaleX:1,duration:.7,ease:"power3.out",...ir},t+0.05);
  tl.fromTo("#name .shine",{x:0},{x:580,duration:1.0,ease:"power2.inOut",...ir},t+0.9);
  tl.fromTo("#name .shine",{x:0},{x:580,duration:1.0,ease:"power2.inOut",immediateRender:false},t+3.0);
  tl.to("#name",{opacity:0,x:40,scaleX:.2,duration:.45,ease:"power2.in"},t+4.4);
  // LOGO: enters only after the name is fully gone (5.0), out 9.4-9.85
  tl.fromTo("#logo",{opacity:0,scale:.4,rotation:-120},{opacity:1,scale:1,rotation:0,duration:.9,ease:"back.out(1.6)",...ir},t+5.0);
  tl.fromTo("#logo .shine",{x:0},{x:380,duration:.9,ease:"power2.inOut",...ir},t+6.1);
  tl.to("#logo",{rotation:360,duration:1.2,ease:"power2.inOut"},t+7.6);
  tl.to("#logo",{opacity:0,scale:.4,rotation:480,duration:.45,ease:"power2.in"},t+9.4);
  first=false;
}
window.__timelines["main"]=tl; tl.seek(0);
</script></body></html>
